name: Cross-Platform Tests

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev]

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ --show-source --statistics

      - name: Format check with Black
        run: |
          black --check --diff src/ tests/

      - name: Import sort check with isort
        run: |
          isort --check-only --diff src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports

      - name: Lint with pylint
        run: |
          pylint src/ --fail-under=8.0 --disable=missing-docstring,invalid-name || true

  test-linux:
    name: Test Linux - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xdotool \
            wmctrl \
            x11-utils \
            xclip \
            xsel \
            libxrandr2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev,linux]
          # Install Playwright browsers for browser automation tests
          playwright install chromium

      - name: Run pytest with coverage
        working-directory: mcp-accurate-click-server
        run: |
          pytest tests/ \
            --verbose \
            --cov=mcp_server \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=test-results.xml \
            -v

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./mcp-accurate-click-server/coverage.xml
          flags: linux-py${{ matrix.python-version }}
          name: linux-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-linux-py${{ matrix.python-version }}
          path: mcp-accurate-click-server/test-results.xml

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-linux-py${{ matrix.python-version }}
          path: mcp-accurate-click-server/htmlcov

  test-windows:
    name: Test Windows - Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev,windows]
          # Install Playwright browsers for browser automation tests
          playwright install chromium

      - name: Run pytest with coverage
        working-directory: mcp-accurate-click-server
        run: |
          pytest tests/ `
            --verbose `
            --cov=mcp_server `
            --cov-report=xml `
            --cov-report=html `
            --cov-report=term-missing `
            --junitxml=test-results.xml `
            -v

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./mcp-accurate-click-server/coverage.xml
          flags: windows-py${{ matrix.python-version }}
          name: windows-py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-windows-py${{ matrix.python-version }}
          path: mcp-accurate-click-server/test-results.xml

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-windows-py${{ matrix.python-version }}
          path: mcp-accurate-click-server/htmlcov

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [test-linux, test-windows]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v3
        with:
          path: coverage-artifacts

      - name: Display coverage summary
        run: |
          echo "Coverage reports available in artifacts"
          find coverage-artifacts -name "coverage.xml" -o -name "htmlcov" | head -20

  test-status-check:
    name: Test Status Check
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test-linux, test-windows]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.lint-and-type-check.result }}" == "failure" ]] || \
             [[ "${{ needs.test-linux.result }}" == "failure" ]] || \
             [[ "${{ needs.test-windows.result }}" == "failure" ]]; then
            echo "One or more test suites failed"
            exit 1
          fi
          echo "All test suites passed successfully!"
